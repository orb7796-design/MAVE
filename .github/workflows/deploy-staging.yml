# Deploys to staging after CI passed on main. Template: needs the repository secrets below and has not run on GitHub.
#   STAGING_HOST, STAGING_USER, STAGING_SSH_KEY (private key), STAGING_PATH (checkout dir on the server)
# Production is deliberately NOT automatic: promote by running the same command on the production host by hand.
name: Deploy staging
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Prepare SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.STAGING_SSH_KEY }}" > ~/.ssh/id_staging && chmod 600 ~/.ssh/id_staging
          ssh-keyscan -H "${{ secrets.STAGING_HOST }}" >> ~/.ssh/known_hosts
      - name: Deploy the commit CI tested
        run: |
          ssh -i ~/.ssh/id_staging "${{ secrets.STAGING_USER }}@${{ secrets.STAGING_HOST }}" \
            "cd '${{ secrets.STAGING_PATH }}' && git fetch origin && git checkout --detach ${{ github.event.workflow_run.head_sha }} \
             && docker compose -p mave-staging -f docker-compose.prod.yml -f docker-compose.staging.yml up -d --build"
      - name: Smoke test
        run: |
          for i in 1 2 3 4 5 6; do
            curl -fsS "https://${{ secrets.STAGING_HOST }}/api/v1/health" && exit 0
            sleep 10
          done
          echo "staging health check failed" >&2; exit 1
